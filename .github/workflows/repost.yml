name: Telegram repost

on:
  schedule:
    - cron: "*/5 * * * *"   # кожні 5 хвилин (мінімум для GitHub)
  workflow_dispatch:         # ручний запуск

permissions:
  contents: write            # щоб зберігати state.json

concurrency:
  group: tg-repost
  cancel-in-progress: false

jobs:
  repost:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run repost
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          TARGET: ${{ secrets.TARGET }}
          SOURCE: Tsaplienko
          MODE: copy
          RUN_ONCE: "1"
        run: python repost.py

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update state [skip ci]"
            git push
          fi
